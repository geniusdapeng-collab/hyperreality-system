# 视频经理版基线围栏包（L2.6：行业阈值默认值由行业 Bundle 提供，底座不内置）
# 单调守卫（F2.3）：is_baseline=true 的规则，任何上层 patch 只可收紧不可放宽
# DSL 求值语义（阶段二 B4 实现）：match 命中后求值 when 表达式（沙箱，禁任意代码 L2.5）；
#   命中 → 按 level 判定；block 优先于 review 优先于 auto（deny 优先并集求值 E2.2）；
#   写类动作无任何规则命中 → 按 default_level 处理；求值异常 → 按 block（宁可错杀 E2.1）
# 审批点矩阵 G1-G10（fusion-design §3 / 拆解台账 §2）
version: ai-video-baseline/v1
default_level: review
rules:
  - rule_id: G1
    name: 商品情报档案确认必审
    level: review
    is_baseline: true
    match:
      object_types: [dossier]
      actions: [dossier.confirm]
    when: "context.batch_mode != true"
    note: 情报档案确认（可配 batchMode 自动）；无源不入库/置信度三级为入库前置闸机

  - rule_id: G2
    name: 创意主题/Brief 确认必审
    level: review
    is_baseline: true
    match:
      object_types: [theme]
      actions: [theme.confirm]
    when: "true"
    note: 创意主题确认（原确认门 2，不可跳过）

  - rule_id: G3
    name: 业务需求对齐清单确认必审
    level: review
    is_baseline: true
    match:
      object_types: [insight]
      actions: [insight.confirm]
    when: "true"
    note: 对齐阈值 0.7 前置；对齐清单确认（原确认门 3，不可跳过）

  - rule_id: G4
    name: PRD 确认必审
    level: review
    is_baseline: true
    match:
      object_types: [prd]
      actions: [prd.confirm]
    when: "true"
    note: PRD 为时长唯一权威源（原确认门 4，不可跳过）

  - rule_id: G5
    name: 定妆照确认（默认可配自动）
    level: review
    is_baseline: true
    match:
      object_types: [portrait_set]
      actions: [portrait.confirm]
    when: "context.portrait_auto != true"
    note: 定妆照确认（原确认门 5，可配 auto/skip）；真实参考图纪律为前置闸机

  - rule_id: G6
    name: 镜头提示词审核必审
    level: review
    is_baseline: true
    match:
      object_types: [prompt_package]
      actions: [prompt.confirm]
    when: "true"
    note: 提示词审核含导演评分报告（原确认门 6，仅调试可跳）；25/30 字段 + 字符口径 2470-3000 前置校验

  - rule_id: G7
    name: 预生产最终确认必审
    level: review
    is_baseline: true
    match:
      object_types: [video_project]
      actions: [preproduction.finalize]
    when: "true"
    note: 预生产最终确认（原确认门 7，仅调试可跳）；进入渲染前的最后一道人工门

  - rule_id: G8
    name: 渲染提交必审（烧额度）
    level: review
    is_baseline: true
    match:
      object_types: [render_script]
      actions: [render.submit]
    when: "context.render_auto != true"
    note: 渲染提交花 API 额度（新增门 8，可降级 auto）；CMS 三档提交：手动/批量/自动化连锁

  - rule_id: G9
    name: 公网发布必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "true"
    note: 发布到公网平台必审（新增门 9）

  - rule_id: G9a
    name: 新平台首发必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "context.platform_first_use == true"
    note: 基线：某账号在某平台首次发布必审，与 G9 并集取严

  - rule_id: G9b
    name: 单账号日发布超限熔断
    level: block
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "context.account_daily_published >= 5"
    note: 基线：单账号日发布上限 5 条，超限熔断+告警（RPA 风控纪律）

  - rule_id: G10a
    name: 夸赞/感谢类评论回复自动
    level: auto
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['praise', 'thanks']"
    note: 三级分流一级：夸赞/感谢自动回（模板库内措辞）

  - rule_id: G10b
    name: 咨询/售后类评论回复必审
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['consult', 'after_sale']"
    note: 三级分流二级：咨询/售后 review，可转人工

  - rule_id: G10c
    name: 负面/投诉/维权类评论回复必审+告警
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['negative', 'crisis'] or contains_any(params.text, ['投诉', '维权', '退款', '骗子', '举报'])"
    note: 三级分流三级+基线：负面/危机 review 并触发告警；含投诉/维权关键词必 review+告警

  - rule_id: G10d
    name: 敏感内容评论回复禁止
    level: block
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent == 'sensitive'"
    note: 三级分流四级：政治敏感等内容 block，只写「需介入」事件，不自动外发

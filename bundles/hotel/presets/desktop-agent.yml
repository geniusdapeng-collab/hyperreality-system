# 数字执行官（机甲师）· PRD P8
preset_key: desktop-agent
name: 数字执行官
version: v0.9
kind: desktop
description: 机甲师。无 API 系统的桌面 GUI 操控兜底；高危动作逐次授权（L3.5）。
readonly: false
night_shift: false
high_risk: true            # 高危：逐次授权
fence_bindings: [R2]       # 涉及价格类动作时保底价硬约束仍然生效
skills: []
tools:
  - { name: desktop.gui, access: write, desc: 虚拟输入通道 GUI 操控（不劫持真实鼠标，L3.5） }
prompt:
  role: 你是云栖酒店的机甲师，只在授权范围内动作。
  goals:
    - 每次 GUI 写动作前逐次取得授权；人接管即让出控制并留痕
  constraints:
    - 验证码/二次认证一律暂停转人工（E3.5）
write_back:
  - desktop.gui

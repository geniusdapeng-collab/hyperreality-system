# 品质巡检官（斥候，只读）· PRD M9/P8
preset_key: inspection-agent
name: 品质巡检官
version: v1.2
kind: inspection
description: 斥候。每日 07:00 定时只读巡检：渠道价格/房态/评价/违规；异常分级推送，一键派单。
readonly: true             # L9.1：只读 preset 不加载任何写工具
night_shift: true
high_risk: false
fence_bindings: []         # 只读，无写动作需绑定
skills: []
tools:
  - { name: channel.status.read, access: read, desc: 渠道状态检查 }
  - { name: price.scan, access: read,        desc: 价格/房态扫描 }
  - { name: review.scan, access: read,       desc: 新评价扫描 }
prompt:
  role: 你是云栖酒店的斥候，只做只读健康检查。
  goals:
    - 异常即写事件并分级（P0/P1/P2）；失败不静默（L9.2）
  constraints:
    - 不执行任何写动作；发现异常交由业务 Agent 处理（一键派单 F9.3）
write_back: []

# WorkLoom 桌面客户端 · electron-builder 分发配置（完全自包含形态）
# 用法：先 bash scripts/pack-electron-payload.sh 装配 dist-payload/，再 pnpm app:dist
# 说明（v2.1.0 起）：客户端完全自包含——extraResources 打入 Node 24 + PostgreSQL 17
#       (+pgvector) + nats-server + 产品载荷，用户机零依赖；首启由
#       apps/desktop/electron/bootstrap.cjs 自动完成装配→initdb→迁移→种子→起服务，
#       客户端窗口即产品（不再打开外部浏览器）。
appId: com.workloom.im
productName: WorkLoom 织元
copyright: Copyright © 2026 WorkLoom
directories:
  output: release
  buildResources: apps/desktop/electron/assets
files:
  - apps/desktop/electron/**/*
  - package.json
# 关键纪律（v2.2.0 漏包实证）：electron-builder 的 extraResources 默认跳过
# **/node_modules/**——载荷的扁平化运行依赖（tsx/hono/pg）会被静默丢弃，
# 产物外观正常但首启装配必崩。每个资源块必须显式 filter: ["**/*"] 强制全量复制。
extraResources:
  - from: dist-payload/runtime
    to: payload/runtime
    filter:
      - "**/*"
  - from: dist-payload/node
    to: payload/node
    filter:
      - "**/*"
  - from: dist-payload/pg
    to: payload/pg
    filter:
      - "**/*"
  - from: dist-payload/nats
    to: payload/nats
    filter:
      - "**/*"
extraMetadata:
  main: apps/desktop/electron/main.cjs
asar: true
# 产物名带平台与架构（GitHub 会剥离中文，arch 后缀是用户分辨安装包的唯一依据）
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# Windows：NSIS 安装包（一键安装、桌面快捷方式）
win:
  target: nsis
  icon: apps/desktop/electron/assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkLoom 织元

# macOS：DMG（按架构分包：arm64 / x64——载荷内 Node 为架构专属，不打 universal）
mac:
  target: dmg
  category: public.app-category.business
  icon: apps/desktop/electron/assets/icon.png

{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "director",
  "agentPreset": "director",
  "trials": 5,
  "businessScope": "视频管线确认门",
  "deliverableUnit": "制片管线核查清单",
  "minimumSubstance": "确认门、上游产物回执、预算依赖与需人工介入项；不越过审批",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "视频管线确认门",
      "input": "当前视频制片管线在推进镜头前应核对哪些确认门、产物回执和预算？请用“确认门”标注依赖与缺失材料，只回答核查清单，不创建项目或推进管线。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "director"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "确认门",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "视频管线确认门：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "视频管线确认门：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}

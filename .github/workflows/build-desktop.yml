# WorkLoom 桌面客户端 · 完全自包含安装包 CI（唯一发行形态，v2.1.0 起）
# 触发：打 tag（v*）或手动 dispatch；产出上传 GitHub Release
# 产物：
#   macOS   WorkLoom 织元-<ver>-arm64.dmg / -x64.dmg（Electron 自包含：Node+PG17+pgvector+nats+载荷）
#   Windows WorkLoom 织元 Setup <ver>.exe（NSIS，同口径自包含）
# 冒烟验收：两平台均在打包后以 bootstrap.cjs --smoke 跑首启全流程
#   （装配→initdb→迁移→seed-aipm 种子→起服务→健康检查），全绿才上传 Release。
name: build-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v2.1.0）"
        required: true
        default: "v2.1.0"

permissions:
  contents: write
  issues: write  # 冒烟失败留证开 Issue（沙箱无法直读 Actions 日志）

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - name: 安装依赖 + 构建 web
        env:
          VITE_DEMO_WORKSPACE: video-studio
          VITE_DEMO_MEMBER: MEM-V01
        run: |
          pnpm install --frozen-lockfile
          grep -q 'WORKLOOM_SAFE_RENDERING' apps/desktop/electron/main.cjs
          grep -q 'WORKLOOM_RENDER_SMOKE' apps/desktop/electron/main.cjs
          grep -q 'previousEnvFile' apps/desktop/electron/bootstrap.cjs
          grep -q 'validateStoredSession' apps/web/src/lib/trpc.ts
          grep -q 'speakAndWait' apps/web/src/components/MateWelcome.tsx
          grep -q 'data-render-mode="vector2d"' apps/web/src/components/loommate/MateLive2D.tsx
          grep -q 'acquireExclusive' apps/web/src/voice/VoiceEngine.ts
          grep -q 'transitionTrace' apps/desktop/electron/main.cjs
          grep -q 'mouthPeak' apps/desktop/electron/main.cjs
          ! grep -q '__workloomEnterTeam' apps/web/src/components/WelcomeCeremony.tsx
          pnpm product:verify
          pnpm exec vitest run apps/web/src/voice/VoiceEngine.test.ts
          pnpm -C apps/web build

      - name: 装配自包含载荷（darwin-arm64）
        run: bash scripts/pack-electron-payload.sh --platform mac --arch arm64 --version "$VERSION"

      - name: 打包 DMG（arm64）
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never -c.extraMetadata.version="${VERSION#v}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 拆包验收 + 冒烟（对 .app 内载荷归档跑首启全流程——验证用户拿到的内容）
        run: |
          APP="$(find release/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "❌ arm64 .app 未生成"; exit 1; }
          RES="$APP/Contents/Resources"
          test -f "$RES/payload.tar.gz" || { echo "❌ 拆包验收失败：payload.tar.gz 未进包"; exit 1; }
          test -f "$RES/payload/PAYLOAD_VERSION" || { echo "❌ 拆包验收失败：PAYLOAD_VERSION 未进包（缺失将致每次启动重解压）"; exit 1; }
          tar -tzf "$RES/payload.tar.gz" > /tmp/wl-pkg-list.txt && grep -q "runtime/node_modules/tsx/package.json" /tmp/wl-pkg-list.txt || { echo "❌ 拆包验收失败：归档内缺 tsx"; exit 1; }
          grep -q "nats/nats-server" /tmp/wl-pkg-list.txt || { echo "❌ 拆包验收失败：归档内缺 nats"; exit 1; }
          echo "✅ 拆包验收通过（arm64 .app 载荷归档完整）"
          node apps/desktop/electron/bootstrap.cjs --smoke --resources "$RES" --support /tmp/wl-smoke
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BIN" || { echo "❌ arm64 应用主程序未生成"; exit 1; }
          WORKLOOM_APP_SMOKE=1 WORKLOOM_SUPPORT_DIR=/tmp/wl-app-smoke "$BIN"
          test -f /tmp/wl-app-smoke/.bootstrapped || { echo "❌ 真实应用首启未完成"; exit 1; }
          WORKLOOM_RENDER_SMOKE=1 WORKLOOM_SUPPORT_DIR=/tmp/wl-render-default "$BIN"
          test -f /tmp/wl-render-default/logs/render-default.json || { echo "❌ 默认渲染探针缺失"; exit 1; }
          WORKLOOM_RENDER_SMOKE=1 WORKLOOM_SAFE_RENDERING=1 WORKLOOM_SUPPORT_DIR=/tmp/wl-render-safe "$BIN"
          test -f /tmp/wl-render-safe/logs/render-safe.json || { echo "❌ 安全渲染探针缺失"; exit 1; }
          echo "✅ 真实 .app 后端 + Live2D + 动态矢量双渲染冒烟通过"
        timeout-minutes: 20

      - name: 上传渲染验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-render-evidence
          if-no-files-found: warn
          path: |
            /tmp/wl-render-default/logs/render-default.*
            /tmp/wl-render-safe/logs/render-safe.*
      - name: 装配自包含载荷（darwin-x64）
        run: bash scripts/pack-electron-payload.sh --platform mac --arch x64 --version "$VERSION"

      - name: 打包 DMG（x64）
        run: pnpm exec electron-builder --mac dmg --x64 --publish never -c.extraMetadata.version="${VERSION#v}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 拆包验收（x64 .app 载荷归档完整性；arm64 runner 无法跑 x64 二进制，文件级核验）
        run: |
          APP="$(find release/mac -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "❌ x64 .app 未生成"; exit 1; }
          RES="$APP/Contents/Resources"
          test -f "$RES/payload.tar.gz" || { echo "❌ x64 载荷归档未进包"; exit 1; }
          tar -tzf "$RES/payload.tar.gz" > /tmp/wl-pkg-list-x64.txt && grep -q "runtime/node_modules/tsx/package.json" /tmp/wl-pkg-list-x64.txt || { echo "❌ x64 归档内缺 tsx"; exit 1; }
          echo "✅ x64 拆包验收通过"
      - name: 失败留证（冒烟日志开 Issue 供远程诊断——沙箱无法直读 Actions 日志）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## build-desktop macos 失败留证（run ${{ github.run_id }}）"
            for f in /tmp/wl-smoke/logs/launch-*.log /tmp/wl-smoke/logs/pg.log /tmp/wl-smoke/logs/server.log /tmp/wl-smoke/logs/web.log; do
              [ -f "$f" ] || continue
              echo ""; echo "### $(basename "$f")（尾部 120 行）"; echo '```'
              tail -120 "$f"; echo '```'
            done
          } > smoke-report.md
          gh issue create --title "build-desktop macOS 冒烟失败留证（${{ env.VERSION }} run ${{ github.run_id }}）" --body-file smoke-report.md || true

      - name: 上传产物（macOS 双架构 DMG + 安装说明）
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          name: ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## 安装说明
            **固定下载入口（永不过期）**：本页地址 `https://github.com/<org>/<repo>/releases/latest` 永远指向最新版；在 Assets 中按 `mac-arm64.dmg`（M 系列芯片）、`mac-x64.dmg`（Intel）或 `win-x64.exe`（Windows）后缀选择。
            **macOS**：下载对应芯片的 dmg → 拖入「应用程序」→ **首次打开前在「终端」执行一次** `xattr -cr "/Applications/HyperReality System.app"`（清除下载隔离属性——当前安装包未做 Apple 公证，因此首次需要）→ 双击打开 → 首启自动初始化约 1 分钟 → 客户端窗口自动出现。
            **Windows**：下载 exe → 双击安装 → SmartScreen 点「更多信息 → 仍要运行」（仅首次需要）→ 桌面双击「HyperReality System」→ 首启自动初始化约 1 分钟。
            > 开箱即「体验模式」：默认游客身份，无需登录即可完整体验（数字人/汇报/各页面）；进入「配置引导」正式开通时才登录注册。体验完可一键清理，填入模型 Key 即可真实使用。
            > 客户端完全自包含（内嵌 Node 24 + PostgreSQL 17 + pgvector + 事件总线），无需安装任何依赖、不打开外部浏览器。

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }

      - name: 编译 pgvector + 同源 PG 运行时（vendor/pg-win + vendor/pgvector-win）
        shell: pwsh
        run: scripts/build-pgvector-win.ps1

      - name: 安装依赖 + 构建 web
        env:
          VITE_DEMO_WORKSPACE: video-studio
          VITE_DEMO_MEMBER: MEM-V01
        run: |
          pnpm install --frozen-lockfile
          pnpm product:verify
          pnpm exec vitest run apps/web/src/voice/VoiceEngine.test.ts
          pnpm -C apps/web build

      - name: 装配自包含载荷（win-x64）
        shell: bash
        run: bash scripts/pack-electron-payload.sh --platform win --arch x64 --version "$VERSION"

      - name: 打包 NSIS 安装包
        shell: bash  # pwsh 会把 -c.extraMetadata.version="x" 的 -c 吞掉（ENOENT 实证），统一 bash
        run: pnpm exec electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="${VERSION#v}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 拆包验收 + 冒烟（对 win-unpacked 载荷归档跑首启全流程——验证用户拿到的内容）
        shell: bash
        run: |
          RES="release/win-unpacked/resources"
          test -f "$RES/payload.tar.gz" || { echo "❌ 拆包验收失败：payload.tar.gz 未进包"; exit 1; }
          test -f "$RES/payload/PAYLOAD_VERSION" || { echo "❌ 拆包验收失败：PAYLOAD_VERSION 未进包（缺失将致每次启动重解压）"; exit 1; }
          tar -tzf "$RES/payload.tar.gz" > /tmp/wl-pkg-list.txt && grep -q "runtime/node_modules/tsx/package.json" /tmp/wl-pkg-list.txt || { echo "❌ 拆包验收失败：归档内缺 tsx"; exit 1; }
          node apps/desktop/electron/bootstrap.cjs --smoke --resources "$RES" --support "${TEMP}/wl-smoke"
          EXE="$(find release/win-unpacked -maxdepth 1 -type f -name '*.exe' ! -iname '*uninstall*' -print -quit)"
          test -n "$EXE" || { echo "❌ Windows 应用主程序未生成"; exit 1; }
          node -e 'const {spawnSync}=require("node:child_process"); const r=spawnSync(process.argv[1],[],{stdio:"inherit",env:{...process.env,WORKLOOM_APP_SMOKE:"1",WORKLOOM_SUPPORT_DIR:process.argv[2]}}); process.exit(r.status ?? 1)' "$EXE" "${TEMP}/wl-app-smoke"
          test -f "${TEMP}/wl-app-smoke/.bootstrapped" || { echo "❌ 真实应用首启未完成"; exit 1; }
          node -e 'const {spawnSync}=require("node:child_process"); const r=spawnSync(process.argv[1],[],{stdio:"inherit",env:{...process.env,WORKLOOM_RENDER_SMOKE:"1",WORKLOOM_SUPPORT_DIR:process.argv[2]}}); process.exit(r.status ?? 1)' "$EXE" "${TEMP}/wl-render-default"
          test -f "${TEMP}/wl-render-default/logs/render-default.json" || { echo "❌ Windows 渲染探针缺失"; exit 1; }
          echo "✅ 真实 Windows 应用后端 + 页面渲染冒烟通过"
        timeout-minutes: 20
      - name: 失败留证（冒烟日志开 Issue 供远程诊断——沙箱无法直读 Actions 日志）
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $fence = [string][char]96 + [string][char]96 + [string][char]96
          $report = "## build-desktop windows 失败留证（run ${{ github.run_id }}）`n"
          Get-ChildItem "$env:TEMP\wl-smoke\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            $report += "`n### $($_.Name)（尾部 120 行）`n$fence`n" + (Get-Content $_.FullName -Tail 120 | Out-String) + "$fence`n"
          }
          $report | Out-File -Encoding utf8 smoke-report.md
          gh issue create --title "build-desktop Windows 冒烟失败留证（${{ env.VERSION }} run ${{ github.run_id }}）" --body-file smoke-report.md
          if ($LASTEXITCODE -ne 0) { Write-Host "issue 创建失败（忽略）" }

      - name: 上传产物（Windows NSIS）
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: ${{ env.VERSION }}
          generate_release_notes: true
